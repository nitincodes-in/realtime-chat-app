<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chattera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-app">

        <header class="chat-header">

            <div class="brand">

                <div class="logo">C</div>

                <div>
                    <h1>Chattera</h1>
                    <span>Online</span>
                </div>

            </div>

            <button class="menu-btn">⋮</button>

        </header>


        <main class="messages" id="messages">

            <div class="message received">

                <div class="bubble">

                    Welcome to Chattera 👋

                    <span class="time">Now</span>

                </div>

            </div>

        </main>


        <footer class="message-area">

            <button class="attach-btn" type="button">
                ＋
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                id="sendBtn"
                class="send-btn"
                type="button"
            >
                ➤
            </button>

        </footer>

    </div>


    <!-- Only our app module -->
    <script type="module" src="app.js"></script>

</body>

</html>
