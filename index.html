<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chattera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         LOGIN / SIGN UP SCREEN
         ============================== -->

    <div id="authScreen" class="auth-screen">

        <div class="auth-box">

            <div class="auth-logo">C</div>

            <h1>Chattera</h1>

            <p class="auth-subtitle">
                Connect. Chat. Stay connected.
            </p>


            <!-- LOGIN -->

            <div id="loginForm">

                <h2>Welcome Back</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    id="loginBtn"
                    class="auth-btn"
                >
                    Login
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <button
                        type="button"
                        id="showSignupBtn"
                        class="text-btn"
                    >
                        Create Account
                    </button>
                </p>

            </div>


            <!-- SIGN UP -->

            <div id="signupForm" style="display: none;">

                <h2>Create Account</h2>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email address"
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    id="signupBtn"
                    class="auth-btn"
                >
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <button
                        type="button"
                        id="showLoginBtn"
                        class="text-btn"
                    >
                        Login
                    </button>
                </p>

            </div>


            <p id="authMessage" class="auth-message"></p>

        </div>

    </div>


    <!-- ==============================
         CHAT SCREEN
         ============================== -->

    <div
        class="chat-app"
        id="chatScreen"
        style="display: none;"
    >

        <header class="chat-header">

            <div class="brand">

                <div class="logo">C</div>

                <div>
                    <h1>Chattera</h1>
                    <span id="onlineStatus">Online</span>
                </div>

            </div>


            <div class="header-actions">

                <button
                    class="profile-btn"
                    id="profileBtn"
                    type="button"
                >
                    Profile
                </button>

                <button
                    class="menu-btn"
                    id="logoutBtn"
                    type="button"
                    title="Logout"
                >
                    ⇥
                </button>

            </div>

        </header>


        <!-- ==============================
             MESSAGES
             ============================== -->

        <main
            class="messages"
            id="messages"
        >

        </main>


        <!-- ==============================
             MESSAGE INPUT
             ============================== -->

        <footer class="message-area">

            <button
                class="attach-btn"
                type="button"
            >
                ＋
            </button>


            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >


            <button
                id="sendBtn"
                class="send-btn"
                type="button"
            >
                ➤
            </button>

        </footer>

    </div>


    <!-- APP JAVASCRIPT -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
